<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hays+Sons">
  <!-- Raster icon source: the brand mark on the white field the artwork is drawn for.
       A white plate is deliberate here. The plus is near-black, so on a transparent
       icon it disappears against a dark wallpaper, tab bar or taskbar and the mark
       reads as a lone red bar. The in-app mark stays transparent (BrandLogo.tsx).
       Geometry mirrors components/BrandLogo.tsx (a 65 x 42 mark) scaled 6.6x. -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <g transform="translate(41.5 117.4) scale(6.6)">
    <rect x="0" y="0" width="14" height="42" fill="#DC2626"/>
    <rect x="36" y="0" width="14" height="42" fill="#1A1A1A"/>
    <rect x="14" y="14" width="51" height="14" fill="#1A1A1A"/>
  </g>
</svg>
