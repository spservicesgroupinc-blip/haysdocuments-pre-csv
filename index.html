<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the saved appearance before styles and React render to avoid a bright flash.
      (() => {
        let preference;
        try { preference = localStorage.getItem('hays.theme.v1'); } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b1220' : '#f8fafc';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Hays + Sons Restoration Document Automation</title>
    <meta name="description" content="Single-entry document automation engine to capture job data and generate PDF contracts, reports, and production packets." />
    <meta property="og:title" content="Hays + Sons Restoration Document Automation" />
    <meta property="og:description" content="Single-entry document automation engine to capture job data and generate PDF contracts, reports, and production packets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
